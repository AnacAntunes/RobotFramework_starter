name: CI Details Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  run-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Install Robot Framework
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Create Output Directories
        run: mkdir -p reports/details

      - name: Run Robot Framework Tests
        run: robot --outputdir reports/details tests/

      - name: Extract Test Results
        run: |
          echo "Passed tests:"
          grep 'status="PASS"' reports/details/output.xml | awk -F\" '{print $6}'
          echo "Failed tests:"
          grep 'status="FAIL"' reports/details/output.xml | awk -F\" '{print $6}'

      - name: Upload Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: reports/details/

      - name: Log Upload Completion
        run: echo "Test reports uploaded. See full results at 'reports/details/report.html'."

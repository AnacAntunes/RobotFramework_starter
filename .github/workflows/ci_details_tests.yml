name: CI Details Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"
  REPORTS_DIR: reports/details

jobs:
  run-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Robot Framework Tests
        run: robot --outputdir ${{ env.REPORTS_DIR }} --exclude k6 tests/

      - name: Extract Test Results
        if: always()
        run: |
          echo "Passed tests:"
          grep 'status="PASS"' ${{ env.REPORTS_DIR }}/output.xml | awk -F\" '{print $6}' || true
          echo "Failed tests:"
          grep 'status="FAIL"' ${{ env.REPORTS_DIR }}/output.xml | awk -F\" '{print $6}' || true

      - name: Publish Test Summary
        if: always()
        run: |
          PASS=$(grep -c 'status="PASS"' ${{ env.REPORTS_DIR }}/output.xml 2>/dev/null || echo 0)
          FAIL=$(grep -c 'status="FAIL"' ${{ env.REPORTS_DIR }}/output.xml 2>/dev/null || echo 0)
          echo "## Detailed Test Results" >> $GITHUB_STEP_SUMMARY
          echo "| Status | Count |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| ✅ Passed | $PASS |" >> $GITHUB_STEP_SUMMARY
          echo "| ❌ Failed | $FAIL |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Passed Tests" >> $GITHUB_STEP_SUMMARY
          grep 'status="PASS"' ${{ env.REPORTS_DIR }}/output.xml | awk -F\" '{print "- " $6}' >> $GITHUB_STEP_SUMMARY || true
          echo "### Failed Tests" >> $GITHUB_STEP_SUMMARY
          grep 'status="FAIL"' ${{ env.REPORTS_DIR }}/output.xml | awk -F\" '{print "- " $6}' >> $GITHUB_STEP_SUMMARY || true

      - name: Upload Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: details-test-results
          path: ${{ env.REPORTS_DIR }}/
          retention-days: 30
